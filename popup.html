<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; font: 13px system-ui, sans-serif; padding: 12px; margin: 0; }
  label { display: block; margin-bottom: 6px; color: #444; }
  input { width: 100%; box-sizing: border-box; padding: 7px; font-size: 13px;
          border: 1px solid #ccc; border-radius: 4px; }
  button { width: 100%; margin-top: 10px; padding: 8px; font-size: 13px;
           border: 0; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: default; }
  #status { margin-top: 10px; color: #555; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
  <label for="topic">Topic to keep (blank = page title)</label>
  <input id="topic" placeholder="e.g. ransomware detection">
  <button id="go">Generate PDF</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
